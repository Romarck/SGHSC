services:
  db:
    image: postgres:16-alpine
    container_name: sghsc_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sghsc}
      POSTGRES_USER: ${POSTGRES_USER:-sghsc_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5444:5432"   # porta 5444 externa — livre no ambiente de dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sghsc_user} -d ${POSTGRES_DB:-sghsc}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sghsc_app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      FLASK_ENV: ${FLASK_ENV:-development}
      DATABASE_URL: postgresql://${POSTGRES_USER:-sghsc_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-sghsc}
    volumes:
      - ./backend:/app
    ports:
      - "5050:5000"   # porta 5050 externa — Flask em 5000 interno
    depends_on:
      db:
        condition: service_healthy
    command: ["/app/entrypoint.sh"]

  nginx:
    image: nginx:1.25-alpine
    container_name: sghsc_nginx
    restart: unless-stopped
    environment:
      # development (padrão) -> HTTP porta 80, sem HSTS
      # production           -> 80 redireciona p/ 443 (HTTPS) + HSTS
      NGINX_ENV: ${NGINX_ENV:-development}
      NGINX_SERVER_NAME: ${NGINX_SERVER_NAME:-_}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/docker-entrypoint.sh:/docker-entrypoint.sh:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./nginx/certbot:/var/www/certbot
      - ./backend/app/static:/static:ro
    entrypoint: ["/docker-entrypoint.sh"]
    depends_on:
      - app

volumes:
  pgdata:
    driver: local
