name: CI

# Story S-08 — pipeline de qualidade: lint, testes, migração e auditoria de deps.
# Falha o build se lint, testes, migração ou pip-audit falharem.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sghsc_ci
          POSTGRES_USER: sghsc_ci
          POSTGRES_PASSWORD: sghsc_ci_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sghsc_ci -d sghsc_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Migração roda contra o Postgres efêmero do serviço acima.
      DATABASE_URL: postgresql://sghsc_ci:sghsc_ci_pass@localhost:5432/sghsc_ci
      POSTGRES_PASSWORD: sghsc_ci_pass
      SECRET_KEY: ci-secret-key-nao-usar-em-producao-000000000000
      FLASK_APP: wsgi.py

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configurar Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade "pip>=26.2.1"
          pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Migração em banco efêmero (flask db upgrade)
        env:
          FLASK_ENV: development   # upgrade não exige a validação de produção
        run: flask db upgrade

      - name: Testes (pytest — TestingConfig, SQLite in-memory)
        run: pytest -q --cov=app --cov-report=term-missing

      - name: Auditoria de dependências (pip-audit)
        # Apoia S-05: falha o build se houver vulnerabilidade conhecida.
        run: pip-audit
