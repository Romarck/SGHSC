# ============================================================================
# Bloco de servidor — DESENVOLVIMENTO LOCAL
# HTTP puro na porta 80. SEM HTTPS e SEM HSTS para não travar o dev.
# Ativado quando NGINX_ENV=development (padrão).
# ============================================================================
server {
    listen 80;
    server_name _;

    # Arquivos estáticos servidos diretamente pelo nginx (mais rápido)
    location /static/ {
        alias /static/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Proxy para a aplicação Flask (Gunicorn)
    location / {
        proxy_pass         http://sghsc_app:5000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_redirect     off;

        # Cabeçalhos de segurança (S-09) — SEM HSTS no dev (S-03).
        # add_header dentro do location precisa repetir os demais (não herda).
        add_header Cache-Control "no-store, no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' https://cdn.jsdelivr.net; img-src 'self' data:; frame-ancestors 'self'" always;
    }
}
