# ============================================================================
# Cabeçalhos de segurança de PRODUÇÃO (HSTS + endurecimento S-09).
# IMPORTANTE: em nginx, `add_header` NÃO é herdado por um bloco `location` que
# define seus próprios `add_header`. Por isso este snippet é incluído DENTRO de
# cada `location` do server de produção — garantindo que HSTS e os demais
# cabeçalhos sejam sempre enviados, inclusive nas respostas proxied (HTMX) e
# estáticas.
# ============================================================================
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options    "nosniff" always;
add_header X-Frame-Options           "SAMEORIGIN" always;
add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
add_header Content-Security-Policy    "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' https://cdn.jsdelivr.net; img-src 'self' data:; frame-ancestors 'self'" always;
