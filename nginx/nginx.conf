worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logs
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    # Segurança — oculta versão do nginx
    server_tokens off;

    # Compressão gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 1024;

    # Timeout
    proxy_read_timeout 60s;
    proxy_connect_timeout 10s;

    # Upload máximo (documentos e certificados)
    client_max_body_size 20M;

    # ---------------------------------------------------------------------------
    # Blocos de servidor gerados pelo entrypoint (docker-entrypoint.sh) a partir
    # do valor de NGINX_ENV:
    #   - development  -> server-dev.conf   (HTTP na porta 80, SEM HSTS)
    #   - production   -> server-prod.conf  (HTTP 80 -> 301 HTTPS 443 + HSTS)
    # O snippet ativo é gerado em /etc/nginx/active/active.conf (dir gravável).
    # ---------------------------------------------------------------------------
    include /etc/nginx/active/active.conf;
}
