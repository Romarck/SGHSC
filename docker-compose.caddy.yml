# docker-compose.caddy.yml — override para VPS onde um Caddy EXTERNO já é o
# reverse proxy TLS da porta 80/443 (caso da VPS de homologação com o DeskcommCRM).
#
# Uso:
#   docker compose -f docker-compose.yml -f docker-compose.caddy.yml up -d --build
#
# Arquitetura:
#   Internet --443/80--> Caddy (externo, faz TLS/HTTPS automático)
#                         --(rede docker compartilhada)--> sghsc_nginx (HTTP interno)
#                                                          --> sghsc_app (Gunicorn)
#
# Diferenças:
#  - sghsc_nginx NÃO publica portas no host (Caddy acessa pela rede docker).
#  - sghsc_nginx roda em modo HTTP interno (NGINX_ENV=development): o TLS/HSTS
#    passa a ser responsabilidade do Caddy externo.
#  - app em modo production (Gunicorn + validação de segredos), sem bind-mount.
#  - db e app não publicam portas.
#  - Conecta os serviços à rede externa do Caddy (deskcommcrm_internal).

services:
  db:
    ports: []

  app:
    environment:
      FLASK_ENV: production
    volumes: []
    ports: []

  nginx:
    # HTTP interno; quem termina o TLS é o Caddy externo.
    environment:
      NGINX_ENV: development
      NGINX_SERVER_NAME: sghsc.romarck.com
    # Sem publicação de portas no host — evita conflito com o Caddy (80/443).
    ports: []
    # Participa da rede do Caddy para ser alcançável como "sghsc_nginx".
    networks:
      - default
      - caddy_net

networks:
  caddy_net:
    external: true
    name: deskcommcrm_internal
