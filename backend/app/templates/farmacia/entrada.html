{% extends "layout.html" %}
{% block title %}Entrada de Estoque{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-md-6">
        <div class="d-flex align-items-center mb-3">
            <a href="{{ url_for('farmacia.estoque') }}" class="btn btn-sm btn-outline-secondary me-3">
                <i class="bi bi-arrow-left"></i>
            </a>
            <h4 class="mb-0"><i class="bi bi-box-arrow-in-down me-2 text-success"></i>Entrada de Estoque</h4>
        </div>

        <div class="card bg-light border-0 mb-3">
            <div class="card-body py-2 small">
                <strong>{{ med.descricao_completa }}</strong> —
                estoque atual: <span class="fw-bold">{{ med.estoque_total }}</span>
            </div>
        </div>

        <div class="card shadow-sm">
            <div class="card-body">
                <form method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Quantidade *</label>
                        <input type="number" name="quantidade" class="form-control" min="1" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Número do lote</label>
                        <input type="text" name="numero_lote" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Validade</label>
                        <input type="date" name="validade" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Fabricante</label>
                        <input type="text" name="fabricante" class="form-control">
                    </div>
                    <div class="d-flex justify-content-end gap-2">
                        <a href="{{ url_for('farmacia.estoque') }}" class="btn btn-outline-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-success">
                            <i class="bi bi-check-lg me-1"></i>Registrar entrada
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
