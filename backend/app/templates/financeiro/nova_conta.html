{% extends "layout.html" %}
{% block title %}Financeiro — Nova conta{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h4 class="mb-0"><i class="bi bi-cash-coin me-2 text-success"></i>Nova conta</h4>
</div>

<div class="card shadow-sm"><div class="card-body">
<form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="row g-3">
        <div class="col-md-8">
            <label class="form-label fw-semibold">Descrição</label>
            <input type="text" name="descricao" class="form-control" required>
        </div>
        <div class="col-md-4">
            <label class="form-label fw-semibold">Tipo</label>
            <select name="tipo" class="form-select">
                {% for e in tipos %}<option value="{{ e.name }}">{{ e.value }}</option>{% endfor %}
            </select>
        </div>
        <div class="col-md-4">
            <label class="form-label fw-semibold">Valor</label>
            <input type="number" name="valor" class="form-control" step="0.01" min="0" required>
        </div>
        <div class="col-md-4">
            <label class="form-label fw-semibold">Vencimento</label>
            <input type="date" name="vencimento" class="form-control" required>
        </div>
        <div class="col-md-4">
            <label class="form-label fw-semibold">Categoria</label>
            <select name="categoria_id" class="form-select">
                <option value="">— nenhuma —</option>
                {% for cat in categorias %}<option value="{{ cat.id }}">{{ cat.nome }}</option>{% endfor %}
            </select>
        </div>
        <div class="col-md-6">
            <label class="form-label fw-semibold">Convênio</label>
            <input type="text" name="convenio" class="form-control">
        </div>
    </div>
    <div class="d-flex justify-content-end gap-2 mt-4">
        <a href="{{ url_for('financeiro.contas') }}" class="btn btn-outline-secondary">Cancelar</a>
        <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg me-1"></i>Salvar</button>
    </div>
</form>
</div></div>
{% endblock %}
