{% extends "layout.html" %}
{% block title %}Prescrever Dieta{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-md-8">
        <div class="d-flex align-items-center mb-3">
            <a href="{{ url_for('nutricao.mapa_dietas') }}" class="btn btn-sm btn-outline-secondary me-3">
                <i class="bi bi-arrow-left"></i>
            </a>
            <h4 class="mb-0"><i class="bi bi-egg-fried me-2 text-success"></i>Prescrição Dietética</h4>
        </div>

        <div class="card bg-light border-0 mb-3">
            <div class="card-body py-2 small">
                <strong>Paciente:</strong> {{ internacao.paciente.nome_exibicao }} &bull;
                <strong>Leito:</strong> {{ internacao.leito.numero }} &bull;
                <strong>Internação:</strong> {{ internacao.numero }}
            </div>
        </div>

        <div class="card shadow-sm">
            <div class="card-body">
                <form method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Tipo de dieta *</label>
                            <select name="tipo_dieta" class="form-select" required>
                                {% for t in tipos %}
                                <option value="{{ t.name }}">{{ t.value | capitalize }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Consistência</label>
                            <select name="consistencia" class="form-select">
                                <option value="">—</option>
                                {% for c in consistencias %}
                                <option value="{{ c.name }}">{{ c.value | capitalize }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Via de alimentação *</label>
                            <select name="via" class="form-select">
                                {% for v in vias %}
                                <option value="{{ v.name }}">{{ v.value | capitalize }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label fw-semibold">Valor calórico (kcal/dia)</label>
                            <input type="number" name="valor_calorico" class="form-control">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label fw-semibold">Fracionamento</label>
                            <input type="text" name="fracionamento" class="form-control" placeholder="6 refeições">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Restrições</label>
                            <input type="text" name="restricoes" class="form-control" placeholder="sem lactose, sem glúten...">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Suplementos</label>
                            <input type="text" name="suplementos" class="form-control">
                        </div>
                        <div class="col-12">
                            <label class="form-label fw-semibold">Observações</label>
                            <textarea name="observacoes" class="form-control" rows="2"></textarea>
                        </div>
                    </div>
                    <hr class="my-3">
                    <div class="d-flex justify-content-end gap-2">
                        <a href="{{ url_for('nutricao.mapa_dietas') }}" class="btn btn-outline-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-success">
                            <i class="bi bi-check-lg me-1"></i>Salvar prescrição
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
