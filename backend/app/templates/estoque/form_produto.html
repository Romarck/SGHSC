{% extends "layout.html" %}
{% block title %}Estoque — Novo produto{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h4 class="mb-0"><i class="bi bi-box-seam me-2 text-secondary"></i>Novo produto</h4>
</div>

<div class="card shadow-sm"><div class="card-body">
<form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="row g-3">
        <div class="col-md-3">
            <label class="form-label fw-semibold">Código</label>
            <input type="text" name="codigo" class="form-control" required>
        </div>
        <div class="col-md-9">
            <label class="form-label fw-semibold">Nome</label>
            <input type="text" name="nome" class="form-control" required>
        </div>
        <div class="col-md-4">
            <label class="form-label fw-semibold">Categoria</label>
            <select name="categoria" class="form-select">
                {% for e in categorias %}<option value="{{ e.name }}">{{ e.value }}</option>{% endfor %}
            </select>
        </div>
        <div class="col-md-4">
            <label class="form-label fw-semibold">Unidade</label>
            <select name="unidade" class="form-select">
                {% for e in unidades %}<option value="{{ e.name }}">{{ e.value }}</option>{% endfor %}
            </select>
        </div>
        <div class="col-md-4">
            <label class="form-label fw-semibold">Estoque mínimo</label>
            <input type="number" name="estoque_minimo" class="form-control" value="0" min="0">
        </div>
    </div>
    <div class="d-flex justify-content-end gap-2 mt-4">
        <a href="{{ url_for('estoque.produtos') }}" class="btn btn-outline-secondary">Cancelar</a>
        <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg me-1"></i>Salvar</button>
    </div>
</form>
</div></div>
{% endblock %}
