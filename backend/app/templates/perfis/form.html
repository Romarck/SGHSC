{% extends "layout.html" %}
{% block title %}{{ titulo }}{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h4 class="mb-0"><i class="bi bi-diagram-3 me-2 text-primary"></i>{{ titulo }}</h4>
    <a href="{{ url_for('perfis.listar') }}" class="btn btn-outline-secondary">
        <i class="bi bi-arrow-left me-1"></i>Voltar
    </a>
</div>

<form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <div class="card shadow-sm mb-3">
        <div class="card-body">
            <div class="row g-3">
                <div class="col-md-5">
                    <label class="form-label">Nome do perfil *</label>
                    <input type="text" name="nome" class="form-control"
                           value="{{ perfil.nome if perfil else '' }}" required>
                </div>
                <div class="col-md-7">
                    <label class="form-label">Descrição</label>
                    <input type="text" name="descricao" class="form-control"
                           value="{{ perfil.descricao if perfil else '' }}">
                </div>
            </div>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-header bg-white d-flex justify-content-between align-items-center">
            <span class="fw-semibold"><i class="bi bi-key me-1"></i>Permissões</span>
            <div>
                <button type="button" class="btn btn-sm btn-outline-secondary" onclick="marcarTodos(true)">Marcar todas</button>
                <button type="button" class="btn btn-sm btn-outline-secondary" onclick="marcarTodos(false)">Limpar</button>
            </div>
        </div>
        <div class="card-body">
            <div class="row g-3">
                {% for modulo, perms in grupos.items() %}
                <div class="col-md-6 col-lg-4">
                    <div class="border rounded p-2 h-100">
                        <div class="fw-semibold text-uppercase small text-muted mb-2">{{ modulo }}</div>
                        {% for codigo, descricao in perms %}
                        <div class="form-check">
                            <input class="form-check-input perm-check" type="checkbox"
                                   name="permissoes" value="{{ codigo }}"
                                   id="perm_{{ codigo }}"
                                   {% if codigo in marcadas %}checked{% endif %}>
                            <label class="form-check-label small" for="perm_{{ codigo }}"
                                   title="{{ codigo }}">{{ descricao }}</label>
                        </div>
                        {% endfor %}
                    </div>
                </div>
                {% endfor %}
            </div>
        </div>
        <div class="card-footer bg-white">
            <button type="submit" class="btn btn-primary">
                <i class="bi bi-check-lg me-1"></i>Salvar perfil
            </button>
        </div>
    </div>
</form>

<script>
function marcarTodos(valor) {
    document.querySelectorAll('.perm-check').forEach(cb => cb.checked = valor);
}
</script>
{% endblock %}
