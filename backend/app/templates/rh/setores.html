{% extends "layout.html" %}
{% block title %}RH — Setores{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h4 class="mb-0"><i class="bi bi-diagram-3 me-2 text-primary"></i>Setores</h4>
    <a href="{{ url_for('rh.funcionarios') }}" class="btn btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i>Voltar</a>
</div>

<div class="row g-3">
    <div class="col-md-4">
        <div class="card shadow-sm"><div class="card-body">
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="mb-3">
                <label class="form-label fw-semibold">Nome</label>
                <input type="text" name="nome" class="form-control" required>
            </div>
            <div class="d-grid">
                <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg me-1"></i>Salvar</button>
            </div>
        </form>
        </div></div>
    </div>
    <div class="col-md-8">
        <div class="card shadow-sm"><div class="card-body p-0">
        {% if setores %}
        <div class="table-responsive"><table class="table table-hover mb-0">
            <thead class="table-light"><tr><th>Nome</th></tr></thead>
            <tbody>
            {% for s in setores %}
            <tr><td class="fw-semibold">{{ s.nome }}</td></tr>
            {% endfor %}
            </tbody>
        </table></div>
        {% else %}
        <div class="text-center text-muted py-5"><i class="bi bi-diagram-3 display-4"></i><p class="mt-2">Nenhum setor cadastrado.</p></div>
        {% endif %}
        </div></div>
    </div>
</div>
{% endblock %}
