{% extends "layout.html" %}
{% block title %}Patrimônio — Novo bem{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h4 class="mb-0"><i class="bi bi-building-gear me-2 text-secondary"></i>Novo bem</h4>
</div>

<div class="card shadow-sm"><div class="card-body">
<form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="row g-3">
        <div class="col-md-4">
            <label class="form-label fw-semibold">Nº patrimônio</label>
            <input type="text" name="numero_patrimonio" class="form-control" required>
        </div>
        <div class="col-md-8">
            <label class="form-label fw-semibold">Descrição</label>
            <input type="text" name="descricao" class="form-control" required>
        </div>
        <div class="col-md-4">
            <label class="form-label fw-semibold">Categoria</label>
            <input type="text" name="categoria" class="form-control">
        </div>
        <div class="col-md-4">
            <label class="form-label fw-semibold">Marca</label>
            <input type="text" name="marca" class="form-control">
        </div>
        <div class="col-md-4">
            <label class="form-label fw-semibold">Modelo</label>
            <input type="text" name="modelo" class="form-control">
        </div>
        <div class="col-md-4">
            <label class="form-label fw-semibold">Nº série</label>
            <input type="text" name="numero_serie" class="form-control">
        </div>
        <div class="col-md-4">
            <label class="form-label fw-semibold">Localização</label>
            <input type="text" name="localizacao" class="form-control">
        </div>
        <div class="col-md-4">
            <label class="form-label fw-semibold">Situação</label>
            <select name="situacao" class="form-select">
                {% for e in situacoes %}<option value="{{ e.name }}">{{ e.value }}</option>{% endfor %}
            </select>
        </div>
        <div class="col-md-4">
            <label class="form-label fw-semibold">Estado de conservação</label>
            <select name="estado" class="form-select">
                {% for e in estados %}<option value="{{ e.name }}">{{ e.value }}</option>{% endfor %}
            </select>
        </div>
        <div class="col-md-4">
            <label class="form-label fw-semibold">Valor de aquisição</label>
            <input type="number" name="valor_aquisicao" class="form-control" step="0.01" min="0">
        </div>
        <div class="col-md-4">
            <label class="form-label fw-semibold">Data de aquisição</label>
            <input type="date" name="data_aquisicao" class="form-control">
        </div>
        <div class="col-md-4">
            <label class="form-label fw-semibold">Vida útil (anos)</label>
            <input type="number" name="vida_util_anos" class="form-control" min="0">
        </div>
    </div>
    <div class="d-flex justify-content-end gap-2 mt-4">
        <a href="{{ url_for('patrimonio.bens') }}" class="btn btn-outline-secondary">Cancelar</a>
        <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg me-1"></i>Salvar</button>
    </div>
</form>
</div></div>
{% endblock %}
