{% extends "layout.html" %}
{% block title %}Pacientes{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h4 class="mb-0"><i class="bi bi-people me-2 text-info"></i>Pacientes</h4>
    <a href="{{ url_for('pacientes.novo') }}" class="btn btn-primary">
        <i class="bi bi-person-plus me-1"></i>Novo paciente
    </a>
</div>

<!-- Busca HTMX -->
<div class="card shadow-sm mb-3">
    <div class="card-body py-2">
        <input type="search"
               name="q"
               class="form-control"
               placeholder="Buscar por nome, CPF ou CNS..."
               value="{{ busca }}"
               hx-get="{{ url_for('pacientes.listar') }}"
               hx-trigger="keyup changed delay:400ms, search"
               hx-target="#tabela-pacientes"
               hx-swap="innerHTML"
               hx-push-url="true"
               autofocus />
    </div>
</div>

<!-- Tabela com resultado -->
<div id="tabela-pacientes">
    {% include "pacientes/_tabela.html" %}
</div>
{% endblock %}
