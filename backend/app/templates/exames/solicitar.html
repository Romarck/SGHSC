{% extends "layout.html" %}
{% block title %}Solicitar Exame{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h4 class="mb-0"><i class="bi bi-plus-lg me-2 text-info"></i>Solicitar Exame</h4>
    <a href="{{ url_for('exames.listar') }}" class="btn btn-outline-secondary btn-sm">
        <i class="bi bi-arrow-left me-1"></i>Voltar
    </a>
</div>

<form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <div class="row g-3">
        <div class="col-md-4">
            <div class="card shadow-sm">
                <div class="card-header py-2"><i class="bi bi-search me-2"></i>Paciente</div>
                <div class="card-body">
                    <input type="search" name="q" class="form-control mb-2"
                           placeholder="Nome, CPF ou CNS..."
                           hx-get="{{ url_for('pacientes.busca_htmx') }}"
                           hx-trigger="keyup changed delay:400ms"
                           hx-target="#resultado-busca-ex" autocomplete="off">
                    <div id="resultado-busca-ex" class="border rounded"></div>
                    <input type="hidden" name="paciente_id" id="paciente_id_input"
                           value="{{ paciente.id if paciente else '' }}">
                    <div id="paciente-selecionado" class="alert alert-success mt-2 py-1 small {% if not paciente %}d-none{% endif %}">
                        <span id="nome-paciente-display">{{ paciente.nome_exibicao if paciente else '' }}</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-md-8">
            <div class="card shadow-sm mb-3">
                <div class="card-header py-2 bg-info text-dark"><i class="bi bi-file-medical me-2"></i>Dados da solicitação</div>
                <div class="card-body">
                    <div class="row g-2">
                        <div class="col-md-4">
                            <label class="form-label small fw-semibold">Prioridade</label>
                            <select name="prioridade" class="form-select">
                                {% for p in prioridades %}
                                <option value="{{ p.name }}">{{ p.value | capitalize }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label small fw-semibold">CID-10</label>
                            <input type="text" name="cid10" class="form-control text-uppercase" placeholder="J18.0">
                        </div>
                        <div class="col-12">
                            <label class="form-label small fw-semibold">Indicação clínica</label>
                            <input type="text" name="indicacao_clinica" class="form-control">
                        </div>
                    </div>
                </div>
            </div>

            <div class="card shadow-sm">
                <div class="card-header py-2 d-flex justify-content-between align-items-center">
                    <span><i class="bi bi-list-check me-2"></i>Exames solicitados</span>
                    <button type="button" class="btn btn-sm btn-success" onclick="addExame()">
                        <i class="bi bi-plus-lg"></i>
                    </button>
                </div>
                <div class="card-body">
                    <div id="itens-exame"></div>
                    <datalist id="catalogo-exames">
                        {% for e in catalogo %}
                        <option value="{{ e.nome }}" data-id="{{ e.id }}">
                        {% endfor %}
                    </datalist>
                </div>
            </div>
        </div>
    </div>

    <div class="d-flex justify-content-end mt-3">
        <button type="submit" class="btn btn-info px-4" id="btn-solicitar" {% if not paciente %}disabled{% endif %}>
            <i class="bi bi-check-lg me-1"></i>Registrar solicitação
        </button>
    </div>
</form>

<template id="tmpl-exame">
    <div class="input-group mb-2 item-exame">
        <input type="text" name="item_nome" class="form-control" list="catalogo-exames"
               placeholder="Nome do exame" required>
        <input type="hidden" name="item_catalogo_id" value="">
        <button type="button" class="btn btn-outline-danger" onclick="this.closest('.item-exame').remove()">
            <i class="bi bi-trash"></i>
        </button>
    </div>
</template>
{% endblock %}

{% block extra_js %}
<script>
function addExame() {
    const t = document.getElementById('tmpl-exame');
    document.getElementById('itens-exame').appendChild(t.content.cloneNode(true));
}
function selecionarPaciente(id, nome) {
    document.getElementById('paciente_id_input').value = id;
    document.getElementById('nome-paciente-display').textContent = nome;
    document.getElementById('paciente-selecionado').classList.remove('d-none');
    document.getElementById('btn-solicitar').disabled = false;
    document.getElementById('resultado-busca-ex').innerHTML = '';
}
document.addEventListener('DOMContentLoaded', addExame);
</script>
{% endblock %}
