{% extends "layout.html" %}
{% block title %}Notificar Infecção{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h4 class="mb-0"><i class="bi bi-clipboard2-pulse me-2 text-danger"></i>Notificação de Infecção</h4>
    <a href="{{ url_for('ccih.painel') }}" class="btn btn-outline-secondary btn-sm">
        <i class="bi bi-arrow-left me-1"></i>Voltar
    </a>
</div>

<form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="row g-3">
        <div class="col-md-4">
            <div class="card shadow-sm">
                <div class="card-header py-2"><i class="bi bi-search me-2"></i>Paciente</div>
                <div class="card-body">
                    <input type="search" name="q" class="form-control mb-2"
                           placeholder="Nome, CPF ou CNS..."
                           hx-get="{{ url_for('pacientes.busca_htmx') }}"
                           hx-trigger="keyup changed delay:400ms"
                           hx-target="#resultado-busca-ccih" autocomplete="off">
                    <div id="resultado-busca-ccih" class="border rounded"></div>
                    <input type="hidden" name="paciente_id" id="paciente_id_input"
                           value="{{ paciente.id if paciente else '' }}">
                    <div id="paciente-selecionado" class="alert alert-success mt-2 py-1 small {% if not paciente %}d-none{% endif %}">
                        <span id="nome-paciente-display">{{ paciente.nome_exibicao if paciente else '' }}</span>
                    </div>
                    <input type="hidden" name="internacao_id" value="">
                </div>
            </div>
        </div>
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-header py-2 bg-danger text-white"><i class="bi bi-virus me-2"></i>Dados da infecção</div>
                <div class="card-body">
                    <div class="row g-2">
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold">Tipo *</label>
                            <select name="tipo" class="form-select" required>
                                {% for t in tipos %}
                                <option value="{{ t.name }}">{{ t.value }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold">Topografia / sítio</label>
                            <input type="text" name="topografia" class="form-control">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold">Microrganismo</label>
                            <input type="text" name="microrganismo" class="form-control">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold">CID-10</label>
                            <input type="text" name="cid10" class="form-control text-uppercase">
                        </div>
                        <div class="col-12">
                            <label class="form-label small fw-semibold">Antibiograma</label>
                            <textarea name="antibiograma" class="form-control" rows="2"></textarea>
                        </div>
                        <div class="col-12">
                            <label class="form-label small fw-semibold">Descrição do caso</label>
                            <textarea name="descricao" class="form-control" rows="3"></textarea>
                        </div>
                    </div>
                    <div class="d-flex justify-content-end mt-3">
                        <button type="submit" class="btn btn-danger" id="btn-notificar" {% if not paciente %}disabled{% endif %}>
                            <i class="bi bi-check-lg me-1"></i>Registrar notificação
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</form>
{% endblock %}

{% block extra_js %}
<script>
function selecionarPaciente(id, nome) {
    document.getElementById('paciente_id_input').value = id;
    document.getElementById('nome-paciente-display').textContent = nome;
    document.getElementById('paciente-selecionado').classList.remove('d-none');
    document.getElementById('btn-notificar').disabled = false;
    document.getElementById('resultado-busca-ccih').innerHTML = '';
}
</script>
{% endblock %}
