{% extends "layout.html" %}
{% block title %}Compras — Novo pedido{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h4 class="mb-0"><i class="bi bi-receipt me-2 text-primary"></i>Novo pedido</h4>
</div>

<div class="card shadow-sm"><div class="card-body">
<form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="row g-3">
        <div class="col-md-6">
            <label class="form-label fw-semibold">Fornecedor</label>
            <select name="fornecedor_id" class="form-select" required>
                {% for f in fornecedores %}<option value="{{ f.id }}">{{ f.razao_social }}</option>{% endfor %}
            </select>
        </div>
    </div>

    <hr class="my-4">
    <div class="d-flex justify-content-between align-items-center mb-2">
        <h6 class="mb-0">Itens</h6>
        <button type="button" class="btn btn-sm btn-outline-primary" onclick="adicionarLinha()"><i class="bi bi-plus-lg me-1"></i>Adicionar item</button>
    </div>
    <div class="table-responsive"><table class="table table-sm align-middle">
        <thead class="table-light"><tr><th>Produto</th><th>Descrição</th><th style="width:120px">Qtd.</th><th style="width:150px">Valor unit.</th><th style="width:50px"></th></tr></thead>
        <tbody id="itens-body"></tbody>
    </table></div>

    <div class="d-flex justify-content-end gap-2 mt-4">
        <a href="{{ url_for('compras.pedidos') }}" class="btn btn-outline-secondary">Cancelar</a>
        <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg me-1"></i>Salvar</button>
    </div>
</form>
</div></div>

<template id="tpl-item">
    <tr>
        <td>
            <select name="produto_id" class="form-select form-select-sm">
                <option value="">— (avulso) —</option>
                {% for p in produtos %}<option value="{{ p.id }}">{{ p.nome }}</option>{% endfor %}
            </select>
        </td>
        <td><input type="text" name="descricao" class="form-control form-control-sm" required></td>
        <td><input type="number" name="quantidade" class="form-control form-control-sm" min="1" value="1"></td>
        <td><input type="number" name="valor_unitario" class="form-control form-control-sm" step="0.01" min="0" value="0"></td>
        <td><button type="button" class="btn btn-sm btn-outline-danger py-0" onclick="this.closest('tr').remove()"><i class="bi bi-trash"></i></button></td>
    </tr>
</template>
{% endblock %}

{% block extra_js %}
<script>
function adicionarLinha() {
    const tpl = document.getElementById('tpl-item');
    const clone = tpl.content.cloneNode(true);
    document.getElementById('itens-body').appendChild(clone);
}
document.addEventListener('DOMContentLoaded', adicionarLinha);
</script>
{% endblock %}
