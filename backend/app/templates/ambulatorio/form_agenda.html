{% extends "layout.html" %}
{% block title %}Nova Grade de Agenda{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h4 class="mb-0"><i class="bi bi-calendar-plus me-2"></i>Nova Grade de Agenda</h4>
    <a href="{{ url_for('ambulatorio.listar_agendas') }}" class="btn btn-outline-secondary btn-sm">
        <i class="bi bi-arrow-left me-1"></i>Voltar
    </a>
</div>
<div class="card shadow-sm" style="max-width:640px">
    <div class="card-body">
        <form method="POST" novalidate>
            {{ form.hidden_tag() }}
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">{{ form.medico_id.label.text }}</label>
                    <select name="medico_id" class="form-select">
                        {% for val, label in form.medico_id.choices %}
                        <option value="{{ val }}">{{ label }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label">{{ form.especialidade.label.text }}</label>
                    <input type="text" name="especialidade" class="form-control"
                        value="{{ form.especialidade.data or '' }}" />
                </div>
                <div class="col-md-4">
                    <label class="form-label">{{ form.dia_semana.label.text }}</label>
                    <select name="dia_semana" class="form-select">
                        {% for val, label in form.dia_semana.choices %}
                        <option value="{{ val }}">{{ label }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label">{{ form.hora_inicio.label.text }}</label>
                    <input type="time" name="hora_inicio" class="form-control"
                        value="{{ form.hora_inicio.data.strftime('%H:%M') if form.hora_inicio.data else '' }}" />
                </div>
                <div class="col-md-4">
                    <label class="form-label">{{ form.hora_fim.label.text }}</label>
                    <input type="time" name="hora_fim" class="form-control"
                        value="{{ form.hora_fim.data.strftime('%H:%M') if form.hora_fim.data else '' }}" />
                </div>
                <div class="col-md-4">
                    <label class="form-label">{{ form.duracao_consulta_min.label.text }}</label>
                    <input type="number" name="duracao_consulta_min" class="form-control"
                        value="{{ form.duracao_consulta_min.data or 20 }}" min="5" max="120" />
                </div>
                <div class="col-md-4">
                    <label class="form-label">{{ form.vagas_total.label.text }}</label>
                    <input type="number" name="vagas_total" class="form-control"
                        value="{{ form.vagas_total.data or 10 }}" min="1" />
                </div>
                <div class="col-md-4">
                    <label class="form-label">{{ form.vagas_reserva.label.text }}</label>
                    <input type="number" name="vagas_reserva" class="form-control"
                        value="{{ form.vagas_reserva.data or 2 }}" min="0" />
                </div>
                <div class="col-md-6">
                    <label class="form-label">{{ form.local.label.text }}</label>
                    <input type="text" name="local" class="form-control"
                        value="{{ form.local.data or '' }}" placeholder="Consultório 1" />
                </div>
                <div class="col-md-6">
                    <label class="form-label">{{ form.observacoes.label.text }}</label>
                    <input type="text" name="observacoes" class="form-control"
                        value="{{ form.observacoes.data or '' }}" />
                </div>
                <div class="col-12 d-flex gap-2 justify-content-end">
                    <a href="{{ url_for('ambulatorio.listar_agendas') }}" class="btn btn-outline-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-check-lg me-1"></i>Salvar agenda
                    </button>
                </div>
            </div>
        </form>
    </div>
</div>
{% endblock %}
